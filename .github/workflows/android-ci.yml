name: K&C Android CI

on:
  push:
    branches: [kc-android-full]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kc-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            android/go.sum
            android/go_client/go.sum

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Test and build universal debug APK
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          unset ANDROID_SDK_ROOT
          chmod +x scripts/*.sh
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify universal APK
        run: |
          APK="app/build/outputs/apk/debug/KC-VPN-universal.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.kavoikov.kcvpn'"
          echo "$BADGING" | grep -F "application-label:'K&C VPN'"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libclient.so"
          unzip -l "$APK" | grep -F "lib/armeabi-v7a/libclient.so"
          unzip -l "$APK" | grep -F "lib/x86_64/libclient.so"

      - name: Stage universal APK
        run: cp app/build/outputs/apk/debug/KC-VPN-universal.apk ../KC-VPN-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KC-VPN-Android-${{ github.sha }}
          path: KC-VPN-Android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent Android download
        if: github.ref == 'refs/heads/kc-android-full'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest KC-VPN-Android.apk --clobber
          else
            gh release create android-latest KC-VPN-Android.apk               --target "${GITHUB_SHA}"               --title "K&C VPN Android"               --notes "Актуальная тестовая сборка K&C VPN для Android."
          fi
