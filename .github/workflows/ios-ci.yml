name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build app on macOS runner
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build WireGuardBridge xcframework
        run: make -C WireGuardBridge xcframework

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned, CI validation)
        run: ./scripts/ci/build_ios.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            WireGuardBridge/build/
            /tmp/xcodebuild-*.log
          if-no-files-found: ignore
