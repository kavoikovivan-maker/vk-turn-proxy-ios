name: K&C iOS Release

on:
  workflow_dispatch:

jobs:
  export-ipa:
    name: Export signed K&C IPA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Validate Apple developer signing readiness
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Apple signing prerequisite not configured: $name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::APPLE_TEAM_ID must be a 10-character Apple Team ID"; exit 1; }
          echo "Apple signing secret names and team ID format verified (values not printed)."

      - name: Set developer team from authorized account
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          team = os.environ["APPLE_TEAM_ID"]
          project = Path("VKTurnProxy/project.yml")
          data = project.read_text()
          import re
          data, count = re.subn(r"DEVELOPMENT_TEAM: [A-Z0-9]{10}", f"DEVELOPMENT_TEAM: {team}", data)
          assert count == 1, "Expected exactly one DEVELOPMENT_TEAM entry"
          project.write_text(data)
          options = Path("VKTurnProxy/ExportOptions.plist")
          data = options.read_text()
          data, count = re.subn(r"(<key>teamID</key>\\s*<string>)[A-Z0-9]{10}(</string>)",
                                lambda match: match.group(1) + team + match.group(2), data)
          assert count == 1, "Expected exactly one export Team ID"
          options.write_text(data)
          PY

      - name: Build WireGuardBridge xcframework
        run: make -C WireGuardBridge xcframework

      - name: Generate Xcode project
        run: xcodegen generate --spec VKTurnProxy/project.yml --project VKTurnProxy

      - name: Validate unsigned build
        run: ./scripts/ci/build_ios.sh

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Archive app
        env:
          KC_CLIENT_PRIVATE_KEY: ${{ secrets.KC_CLIENT_PRIVATE_KEY }}
        run: |
          xcodebuild \
            -project VKTurnProxy/VKTurnProxy.xcodeproj \
            -scheme VKTurnProxy \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/KCSmartVPN.xcarchive \
            -allowProvisioningUpdates \
            KC_CLIENT_PRIVATE_KEY="$KC_CLIENT_PRIVATE_KEY" \
            clean archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/KCSmartVPN.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist VKTurnProxy/ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: kc-smart-vpn-ipa
          path: build/ipa/*.ipa
